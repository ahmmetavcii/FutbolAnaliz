full_match:
  schema_version: 1.0.0
  profile: dual_camera
  chunk_seconds: 120
  resume: true
  fail_fast: true

cameras:
  expected_count: 2
  processing: sequential
  max_concurrent: 1
  synchronization_required: true

inference:
  batch_size: 1
  workers: 0
  heavy_models: sequential
  max_concurrent_heavy_models: 1

resources:
  max_vram_gb: 10
  min_free_vram_gb: 1
  max_ram_gb: 24
  min_free_ram_gb: 3
  cache_max_gb: 3

artifacts:
  checksum: sha256
  atomic_writes: true
  retain_chunk_outputs: true
